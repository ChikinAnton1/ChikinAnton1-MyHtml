<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        #textarea{
            width: 300px;
            height: 30px;
        }
        #myfirstform{
            width: 600px;
            margin: 0 auto;
            padding: 15px;
            border: 2px solid black;
        }
        #myfirstform div{
            padding: 5px;
        }
        .bio{
            display: block;
        }
    </style>
    
    <button> First button </button>
    <input>
    <input type="text" disabled required pattern="/0-9[2]" minlength="3">
    <!-- <textarea name="" cols="50" rows="10" ></textarea> -->
    <textarea name="" id="textarea"></textarea>
    <hr>
    <input type="text" placeholder="Enter text" value="Hello" readonly>
    <hr>
    <input type="number" placeholder="you age">
    <input type="button" value="Button text" disabled>
    <input type="color">
    <input type="date">
    <input type="datetime">
    <input type="time">
    <input type="url">
    <input type="image" src="">
    <input type="hidden">
    <hr>
    <input type="checkbox" id="Apple"> <label for="Apple"> Apple </label>
    <input type="checkbox" id="Xiaomi"> <label for="Xiaomi"> Xiaomi </label>
    <input type="checkbox"> Sumsung
    <hr>
    <input type="radio" id="Присутній" name="Відвідуваність"> <label for="Присутній">Присутній</label>
    <input type="radio" id="Відсутній" name="Відвідуваність"> <label for="Відсутній">Відсутній</label>
    <input type="radio" id="Запізнився" name="Відвідуваність"> <label for="Запізнився">Запізнився</label>
    <hr>
    <form action="" id="myfirstform">
        <div>
            <label for="fname">Enter name</label>
            <input type="text" name="fname" id="fname">
        </div>
        <div>
            <label for="lname"> Enter last name</label>
            <input type="text" name="lname" id="lname">
        </div>
        <div>
            <label for="password"> Enter password</label>
            <input type="password" name="password" id="password">
        </div>
        <div>
            <input type="radio" id="male" name="sex">
            <label for="male"> Male</label>
            <input type="radio" id="female" name="sex">
            <label for="female"> Female</label>
        </div>
        <div>
            <input type="checkbox" id="Apple" name="device">
            <label for="Apple">Apple</label>
            <input type="checkbox" id="Xiaomi" name="device">
            <label for="Xiaomi"> Xiaomi</label>
            <input type="checkbox" id="Sumsung" name="device">
            <label for="Sumsung"> Sumsung</label>
        </div>
        <div>
            <label for="bio" class="bio"> Біографія </label>
            <textarea name="bio" id="bio" cols="30" rows="10"></textarea>
            <input type="submit">
        </div>
    </form>
</body>
</html>
